name: Gosec

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Sundays at 01:00 UTC
    - cron: '0 1 * * 0'

permissions:
  contents: read
  security-events: write

# Cancel superseded runs on the same ref, everywhere except main and tags.
# Feature branches now run CI on every push, so without this a burst of
# commits leaves several full runs racing over stale code.
#
# main and tags are exempt on purpose: ci.yml's release job publishes via
# GoReleaser on a tag build, and a cancelled release is worse than a
# duplicated one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # One scan per target GOOS (#930). What differs by platform is which files
  # compile, not the runner OS, and securego/gosec is a Docker container action
  # that only runs on Linux runners anyway — so the matrix sets GOOS for the
  # scan rather than the runner. Each upload gets its own SARIF category, or
  # the three results would overwrite each other in code scanning.
  gosec:
    name: Security Scan (${{ matrix.goos }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Gosec
        uses: securego/gosec@master
        env:
          GOOS: ${{ matrix.goos }}
        with:
          # G304 excluded: CLI tool reads user-supplied file paths by design
          # G204 excluded: remaining calls are git subprocess with hardcoded binary name
          args: '-no-fail -exclude=G304,G204 -fmt sarif -out gosec-results.sarif ./...'

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gosec-results.sarif
          category: gosec-${{ matrix.goos }}
