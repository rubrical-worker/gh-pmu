name: CI

on:
  push:
    # Every branch, not an allow-list of prefixes. Branch names here are not
    # conventional — chore/, docs/, fix/, ci/, feat/, config/, debt/, bug/,
    # pmu/, ghpmu/ and idpf/ all appear in the history — so any enumerated
    # list silently misses the next new prefix, and a branch with no CI looks
    # exactly like a branch that passed.
    #
    # Without this, /work commits per AC and /done pushes the batch, so the
    # first CI signal arrives at merge time with every commit at once.
    branches: ['**']
    tags:
      - "v*"
  pull_request:
    branches: [main]

permissions:
  contents: write

# Cancel superseded runs on the same ref, everywhere except main and tags.
# Feature branches now run CI on every push, so without this a burst of
# commits leaves several full runs racing over stale code.
#
# main and tags are exempt on purpose: ci.yml's release job publishes via
# GoReleaser on a tag build, and a cancelled release is worse than a
# duplicated one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Test and Lint run in parallel
  # Unit tests on every supported OS (#930). Offline only: -short, no build
  # tags, so no integration/e2e test (live GitHub API, #876) is compiled in.
  # fail-fast is off so one OS failing still reports the others.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.23']
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Download dependencies
        run: go mod download

      # -race needs cgo and a C toolchain, which the Windows runner is not
      # guaranteed to have, so Windows runs without it. Coverage is collected
      # on Linux only: the floor is one number, computed once.
      - name: Run tests
        run: |
          flags="-v -short"
          if [ "$RUNNER_OS" != "Windows" ]; then flags="$flags -race"; fi
          if [ "$RUNNER_OS" = "Linux" ]; then flags="$flags -coverprofile=coverage.out -covermode=atomic"; fi
          go test $flags ./...

      - name: Verify config not corrupted by tests
        run: node .claude/scripts/open-release/verify-config.js

      - name: Upload coverage reports to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Generate coverage report
        if: runner.os == 'Linux'
        run: go tool cover -func=coverage.out

      - name: Check coverage threshold
        if: runner.os == 'Linux'
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print substr($3, 1, length($3)-1)}')
          echo "Total coverage: ${COVERAGE}%"
          THRESHOLD=15
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 1
          fi
          echo "Coverage ${COVERAGE}% meets threshold ${THRESHOLD}%"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -s -l .)" ]; then
            echo "Go code is not formatted:"
            gofmt -s -l .
            exit 1
          fi

      - name: Download dependencies
        run: go mod download

      - name: Run go vet
        run: go vet ./...

      # Compile-check tag-gated tests WITHOUT running them. Integration/e2e
      # tests make live GitHub API calls and must never run in CI (caused an
      # account lockout, 2025-12-08 — see #876). `go vet` only type-checks and
      # compiles; it makes zero API calls, so this catches tag-gated rot
      # (e.g. signature drift) that plain `go test -short` never compiles.
      - name: Compile-check tag-gated tests (no API calls)
        run: go vet -tags "integration e2e" ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  # Build waits for Test and Lint to pass
  build:
    needs: [test, lint]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.23']
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -v ./...

      # GOEXE is ".exe" on Windows and empty elsewhere.
      - name: Build binary
        run: go build -o "gh-pmu$(go env GOEXE)" .

      # Must fail the job when the binary cannot start (#930). --version
      # needs no config, terms acceptance or network.
      - name: Verify binary
        run: ./gh-pmu$(go env GOEXE) --version

  # Release waits for Build to pass (only on tags)
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
