name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Sundays at 00:00 UTC
    - cron: '0 0 * * 0'

permissions:
  contents: read
  security-events: write

# Cancel superseded runs on the same ref, everywhere except main and tags.
# Feature branches now run CI on every push, so without this a burst of
# commits leaves several full runs racing over stale code.
#
# main and tags are exempt on purpose: ci.yml's release job publishes via
# GoReleaser on a tag build, and a cancelled release is worse than a
# duplicated one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # One analysis per target GOOS (#930): the extractor sees the file set each
  # platform compiles. The build is explicit (build-mode: manual) so it is
  # certain to run under the matrix GOOS; autobuild gives no such guarantee.
  # Each GOOS uploads under its own category so results do not overwrite.
  analyze:
    name: Analyze (${{ matrix.goos }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
    env:
      GOOS: ${{ matrix.goos }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go
          build-mode: manual
          # Use extended query suite for more thorough analysis
          queries: security-extended

      - name: Build
        run: go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:go/goos:${{ matrix.goos }}"
